name: ChatGPT example
on:
  pull_request:
    paths: ['examples/chatgpt/**', 'mcpb/server/**', '.github/workflows/chatgpt-example.yml']
  push:
    paths: ['examples/chatgpt/**', 'mcpb/server/**', '.github/workflows/chatgpt-example.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: examples/chatgpt
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: examples/chatgpt/package-lock.json
      - run: npm ci
      - run: npm run check:upstream
      - run: npm run format:check
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
