name: Release

# Cut a release by pushing a version tag:
#   npm version minor   # bumps package.json + creates the vX.Y.Z tag
#   git push --follow-tags
# Add the matching section to CHANGELOG.md first — it becomes the release notes.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write # needed to create the GitHub Release

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Gate the release on the test suite.
      - run: npm test

      # Builds the extension and produces dist/inflow-<version>-chrome.zip
      - run: npm run zip

      # The Claude Desktop bundle (dist/Inflow.mcpb) — the Agent Access modal
      # and inflow.im link to this release asset by its stable
      # releases/latest/download/Inflow.mcpb URL.
      - run: npm run mcpb:build

      # Build the release body: this version's CHANGELOG section (unwrapped —
      # GitHub renders release notes with hard line breaks on, so the
      # markdown's column wrapping would show as real breaks) plus the standard
      # "How to update" section. generate_release_notes appends the commit list.
      - name: Build release notes
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          # Full version, suffix included: the script reads the base version's
          # CHANGELOG section (written once, for the version it becomes) and
          # uses the suffix to pick the beta install instructions.
          node scripts/release-notes.mjs "$VERSION" > release-notes.md
          echo "Built release notes for v$VERSION"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          body_path: release-notes.md
          generate_release_notes: true # appends an auto commit/PR changelog
          # Hyphenated tags (v0.8.0-beta.1) are betas: marked prerelease, and
          # the store jobs below skip them entirely.
          prerelease: ${{ contains(github.ref_name, '-') }}
          # This repo has immutable releases: assets can only be attached
          # while the release is a draft, so create it as one and publish in
          # the next step once the uploads are in.
          draft: true
          files: |
            dist/*.zip
            dist/Inflow.mcpb
            .output/*.zip

      - name: Publish the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$GITHUB_REF_NAME" --draft=false --repo "$GITHUB_REPOSITORY"

  # Publishes the same tag to the Chrome Web Store. Separate job so a store-side
  # failure (expired token, review rejection) leaves the GitHub Release intact
  # rather than failing the whole run after the release already exists.
  #
  # Requires four repository secrets. The first three come from a Google Cloud
  # OAuth client with the Chrome Web Store API enabled; minting the refresh token
  # is a one-time interactive consent flow — see docs/chrome-web-store-release.md.
  #   CWS_CLIENT_ID · CWS_CLIENT_SECRET · CWS_REFRESH_TOKEN
  chrome-web-store:
    name: Publish to Chrome Web Store
    needs: release
    # Betas (any hyphenated tag) never go to the store.
    if: ${{ !contains(github.ref_name, '-') }}
    runs-on: ubuntu-latest
    env:
      # Public — it is the ID in the store listing URL.
      EXTENSION_ID: ndehgbgifkapdigmefglpgacpagoclge
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # The store rejects any manifest carrying a `key`, so this build omits it.
      # Produces dist/inflow-<version>-chrome-store.zip
      - run: npm run zip:store

      - name: Upload and publish
        env:
          CWS_CLIENT_ID: ${{ secrets.CWS_CLIENT_ID }}
          CWS_CLIENT_SECRET: ${{ secrets.CWS_CLIENT_SECRET }}
          CWS_REFRESH_TOKEN: ${{ secrets.CWS_REFRESH_TOKEN }}
        run: |
          set -euo pipefail

          if [ -z "${CWS_CLIENT_ID:-}" ] || [ -z "${CWS_CLIENT_SECRET:-}" ] || [ -z "${CWS_REFRESH_TOKEN:-}" ]; then
            echo "::error::CWS_CLIENT_ID / CWS_CLIENT_SECRET / CWS_REFRESH_TOKEN are not all set."
            exit 1
          fi

          ZIP=$(ls dist/inflow-*-chrome-store.zip)
          echo "Publishing $ZIP to $EXTENSION_ID"

          # Refresh tokens do not expire on their own, but they are revoked if the
          # OAuth client is deleted or consent is withdrawn — so fail loudly here.
          TOKEN=$(curl -sS -X POST https://oauth2.googleapis.com/token \
            -d client_id="$CWS_CLIENT_ID" \
            -d client_secret="$CWS_CLIENT_SECRET" \
            -d refresh_token="$CWS_REFRESH_TOKEN" \
            -d grant_type=refresh_token | jq -r '.access_token // empty')

          if [ -z "$TOKEN" ]; then
            echo "::error::Could not mint an access token. Re-run the consent flow to get a fresh CWS_REFRESH_TOKEN."
            exit 1
          fi

          UPLOAD=$(curl -sS -X PUT \
            -H "Authorization: Bearer $TOKEN" \
            -H "x-goog-api-version: 2" \
            -T "$ZIP" \
            "https://www.googleapis.com/upload/chromewebstore/v1.1/items/$EXTENSION_ID")
          echo "Upload response: $UPLOAD"

          # A failed upload still returns HTTP 200 — the verdict is in the body.
          if [ "$(echo "$UPLOAD" | jq -r '.uploadState // empty')" != "SUCCESS" ]; then
            echo "::error::Upload rejected: $(echo "$UPLOAD" | jq -r '[.itemError[]?.error_detail] | join("; ")')"
            exit 1
          fi

          PUBLISH=$(curl -sS -X POST \
            -H "Authorization: Bearer $TOKEN" \
            -H "x-goog-api-version: 2" \
            -H "Content-Length: 0" \
            "https://www.googleapis.com/chromewebstore/v1.1/items/$EXTENSION_ID/publish")
          echo "Publish response: $PUBLISH"

          STATUS=$(echo "$PUBLISH" | jq -r '(.status // []) | join(",")')
          case "$STATUS" in
            *OK*|*ITEM_PENDING_REVIEW*|*PUBLISHED_WITH_FRICTION_WARNING*)
              echo "Submitted for publication: $STATUS"
              echo "### Chrome Web Store: \`$STATUS\`" >> "$GITHUB_STEP_SUMMARY"
              ;;
            *)
              echo "::error::Publish failed: $(echo "$PUBLISH" | jq -r '(.statusDetail // []) | join("; ")')"
              exit 1
              ;;
          esac

  # Publishes the same tag to Microsoft Edge Add-ons. Separate job for the same
  # reason as chrome-web-store. While the Partner Center credentials aren't
  # configured, the job SKIPS instead of failing, so releases keep working
  # before the Edge listing exists. Credentials come from Partner Center's
  # Publish API page — see docs/edge-add-ons-release.md.
  #   EDGE_PRODUCT_ID · EDGE_CLIENT_ID · EDGE_API_KEY
  edge-add-ons:
    name: Publish to Edge Add-ons
    needs: release
    # Betas (any hyphenated tag) never go to the store.
    if: ${{ !contains(github.ref_name, '-') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # The same key-less build the Chrome Web Store gets — the manifest is
      # browser-agnostic, so one artifact serves both stores.
      - run: npm run zip:store

      - name: Upload and publish
        env:
          EDGE_PRODUCT_ID: ${{ secrets.EDGE_PRODUCT_ID }}
          EDGE_CLIENT_ID: ${{ secrets.EDGE_CLIENT_ID }}
          EDGE_API_KEY: ${{ secrets.EDGE_API_KEY }}
        run: |
          set -euo pipefail

          if [ -z "${EDGE_PRODUCT_ID:-}" ] || [ -z "${EDGE_CLIENT_ID:-}" ] || [ -z "${EDGE_API_KEY:-}" ]; then
            echo "Edge Add-ons secrets not configured — skipping (see docs/edge-add-ons-release.md)."
            echo "### Edge Add-ons: skipped (secrets not configured)" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          ZIP=$(ls dist/inflow-*-chrome-store.zip)
          echo "Publishing $ZIP to product $EDGE_PRODUCT_ID"

          API="https://api.addons.microsoftedge.microsoft.com/v1/products/$EDGE_PRODUCT_ID"
          # `|| true` at every call site: grep exits non-zero when there is no
          # Location header, and under set -e/pipefail that killed the script
          # before the explanatory error below could run.
          operation_id() { grep -i '^location:' | awk '{print $2}' | tr -d '\r'; }

          # Upload the package into the draft submission. Accepted uploads
          # return 202 with the operation ID in the Location header.
          OP=$(curl -sS -D - -o /dev/null -X POST \
            -H "Authorization: ApiKey $EDGE_API_KEY" \
            -H "X-ClientID: $EDGE_CLIENT_ID" \
            -H "Content-Type: application/zip" \
            --data-binary "@$ZIP" \
            "$API/submissions/draft/package" | operation_id || true)

          if [ -z "$OP" ]; then
            echo "::error::Package upload was not accepted (no operation ID; check the API key expiry in Partner Center)."
            exit 1
          fi

          STATUS=""
          for _ in $(seq 1 30); do
            sleep 10
            BODY=$(curl -sS \
              -H "Authorization: ApiKey $EDGE_API_KEY" \
              -H "X-ClientID: $EDGE_CLIENT_ID" \
              "$API/submissions/draft/package/operations/$OP")
            STATUS=$(echo "$BODY" | jq -r '.status // empty')
            echo "Upload operation: $STATUS"
            [ "$STATUS" = "Succeeded" ] && break
            if [ "$STATUS" = "Failed" ]; then
              echo "Upload operation body: $BODY"
              echo "::error::Package processing failed (often: version not higher than the listed one): $(echo "$BODY" | jq -r '[.message, ((.errors // []) | map(.message // tostring) | join("; "))] | map(select(. != null and . != "")) | join(" - ")')"
              exit 1
            fi
          done
          if [ "$STATUS" != "Succeeded" ]; then
            echo "::error::Package processing timed out."
            exit 1
          fi

          # Publish the draft — this creates the submission Microsoft reviews.
          PUBRESP=$(curl -sS -D /tmp/pub-headers -X POST \
            -H "Authorization: ApiKey $EDGE_API_KEY" \
            -H "X-ClientID: $EDGE_CLIENT_ID" \
            -H "Content-Length: 0" \
            "$API/submissions")
          PUBOP=$(operation_id < /tmp/pub-headers || true)

          if [ -z "$PUBOP" ]; then
            echo "Publish response: $PUBRESP"
            echo "::error::Publish was not accepted (an in-progress submission may already exist in Partner Center): $(echo "$PUBRESP" | jq -r '.message // .errors // empty')"
            exit 1
          fi

          STATUS=""
          for _ in $(seq 1 12); do
            sleep 10
            BODY=$(curl -sS \
              -H "Authorization: ApiKey $EDGE_API_KEY" \
              -H "X-ClientID: $EDGE_CLIENT_ID" \
              "$API/submissions/operations/$PUBOP")
            STATUS=$(echo "$BODY" | jq -r '.status // empty')
            echo "Publish operation: $STATUS"
            [ "$STATUS" = "Succeeded" ] && break
            if [ "$STATUS" = "Failed" ]; then
              # Without the body this said only "Failed", which is why the
              # 0.6.0 run gave no reason to act on.
              echo "Publish operation body: $BODY"
              echo "::error::Submission failed: $(echo "$BODY" | jq -r '[.message, ((.errors // []) | map(.message // tostring) | join("; "))] | map(select(. != null and . != "")) | join(" - ")')"
              exit 1
            fi
          done
          if [ "$STATUS" != "Succeeded" ]; then
            echo "::error::Submission did not settle in time — check Partner Center."
            exit 1
          fi

          echo "Submitted for review."
          echo "### Edge Add-ons: submitted for review" >> "$GITHUB_STEP_SUMMARY"
